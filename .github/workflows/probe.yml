name: probe
on:
  push:
    paths: ["scripts/probe.py"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe.py
      - run: |
          git config user.name kalender-bot; git config user.email kalender-bot@users.noreply.github.com
          git pull -q; git add probe; git commit -qm probe; git push
